apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: worker-scaler

spec:
  scaleTargetRef:
    name: worker-deployment

  minReplicaCount: 0
  maxReplicaCount: 10

  triggers:
  - type: rabbitmq
    metadata:
      queueName: accidents
      queueLength: "5"
      host: amqp://user:pass@rabbitmq:5672
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: dashboard-monitor
  namespace: monitoring    # ← mora biti isti namespace kao Prometheus
  labels:
    release: prometheus    # ← mora se poklapati sa Prometheus operatorom
spec:
  namespaceSelector:
    matchNames:
      - default            # ← namespace gde je Dashboard
  selector:
    matchLabels:
      app: dashboardapp
  endpoints:
    - port: http
      path: /metrics
      interval: 15s
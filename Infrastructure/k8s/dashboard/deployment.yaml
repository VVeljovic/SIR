apiVersion: apps/v1
kind: Deployment
metadata:
  name: dashboard-deployment
  labels:
    app: dashboard-deployment
spec:
  replicas: 1
  selector: 
    matchLabels:
      app: dashboardapp
  template:
    metadata:
      labels:
        app: dashboardapp
    spec:
      containers:
        - name: dashboardapp
          image: dashboard:latest
          imagePullPolicy: Never
          ports: 
            - containerPort: 8080
          env:
            - name: ConnectionStrings__Database
              valueFrom: 
                configMapKeyRef:
                    name : dashboard-config-map
                    key: connection_string
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
          livenessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 15
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: dashboard-service
  labels:
    app: dashboardapp
spec:
  type: NodePort
  selector:
    app: dashboardapp
  ports:
    - protocol: TCP
      port: 8080
      targetPort: 8080
      name: http        
